name: Android CI
# Auto-labels each run in the Actions list instead of a generic "Android
# CI" repeated for every single run: a PR build names itself after the PR
# (number + title), anything else after the branch and short commit.
run-name: >-
  ${{ github.event_name == 'pull_request'
    && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
    || format('{0} @ {1}', github.ref_name, github.sha) }}

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install required SDK platform/build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Rolling pre-release: every push OR PR build overwrites the single
      # "dev" tag/release with the latest debug build, so there's always a
      # current APK to grab without digging through Actions artifacts
      # (which expire and need repo access). Previously gated to
      # `push to main` only -- since all real work happens on aa-post-v1/PRs
      # against it, that meant this release never actually got published.
      # Body/name now say which branch or PR it actually came from, since a
      # single rolling tag means whichever build ran last is what's there.
      # Never touches real (tagged) releases -- those stay a manual,
      # owner-published step. `contents: write` (workflow-level permissions
      # above) covers `pull_request` here too since this repo has no
      # outside forks to worry about restricting.
      - name: Publish rolling dev pre-release
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Dev build (${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }})"
          body: |
            Automatically rebuilt from `${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}` at `${{ github.event.pull_request.head.sha || github.sha }}`.
            **Not a real release** — unsigned debug build, may be broken. For testing only.
          prerelease: true
          draft: false
          files: app/build/outputs/apk/debug/app-debug.apk
