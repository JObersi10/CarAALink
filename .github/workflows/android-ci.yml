name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install required SDK platform/build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Rolling pre-release: every push to main overwrites the single "dev"
      # tag/release with the latest debug build, so there's always a current
      # APK to grab without digging through Actions artifacts (which expire
      # and need repo access). Never touches real (tagged) releases -- those
      # stay a manual, owner-published step.
      - name: Publish rolling dev pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: "Dev build (latest main)"
          body: |
            Automatically rebuilt from `main` at ${{ github.sha }}.
            **Not a real release** — unsigned debug build, may be broken. For testing only.
          prerelease: true
          draft: false
          files: app/build/outputs/apk/debug/app-debug.apk
